# ============================================================
# MYSQL profile  ?  real MySQL + Flyway, teammate / CI mode
# Run with: -Dspring-boot.run.profiles=mysql
# Or set env var: SPRING_PROFILES_ACTIVE=mysql
# ============================================================

# ?? DataSource ????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payment_processing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:n3u3da!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

# ?? JPA ???????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?? Flyway ????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ?? H2 console disabled ???????????????????????????????????
spring.h2.console.enabled=false
spring.sql.init.mode=never

# ?? Mail: use real Gmail SMTP (set these as env vars) ?????
# export MAIL_USERNAME=you@gmail.com
# export MAIL_PASSWORD=your-app-password
# export MAIL_FROM=you@gmail.com
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
