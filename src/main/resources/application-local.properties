# ============================================================
# LOCAL profile  ?  H2 embedded DB, no MySQL needed
# Activated automatically unless SPRING_PROFILES_ACTIVE overrides it.
# ============================================================

# ?? DataSource ????????????????????????????????????????????
spring.datasource.url=jdbc:h2:file:./.local-db/payment_processing_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

# ?? JPA ???????????????????????????????????????????????????
# create  = drop & recreate schema every startup (clean state)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

# ?? Flyway disabled (we use data.sql instead) ?????????????
spring.flyway.enabled=false

# ?? Seed data ?????????????????????????????????????????????
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ?? H2 web console ????????????????????????????????????????
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ?? Mail: local mode uses a dummy localhost relay ?????????
# Email failures are caught in PaymentServiceImpl and never
# roll back a completed transaction, so this is safe.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
app.mail.enabled=${APP_MAIL_ENABLED:false}
