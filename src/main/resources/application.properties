# =============================
# Active Profile (override per environment)
# local  -> H2 in-memory, no MySQL needed (default for dev)
# mysql  -> MySQL + Flyway (teammate / production-like)
# =============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =============================
# Application
# =============================
spring.application.name=${APP_NAME:payment-processing-system}
server.port=${SERVER_PORT:8080}

# =============================
# JPA / Hibernate  (shared)
# =============================
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =============================
# Swagger / OpenAPI (springdoc)
# =============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =============================
# Spring Mail  (credentials always via env vars)
# =============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mail notification feature flags
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# =============================
# Logging
# =============================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.payment=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_SQL_BIND:WARN}
logging.file.name=${LOG_FILE:logs/payment-processing-system.log}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:14}
