# Test override for the local profile.
# Uses H2 in-memory (not file-based) so tests never conflict with a running server.
spring.datasource.url=jdbc:h2:mem:test_payment_processing_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

spring.h2.console.enabled=false

# Silence mail for tests ? payment succeeds even when mail fails
spring.mail.host=localhost
spring.mail.port=2525

